# ==============================================================================
# AeroGaming OS - Lenovo V15 ADA System & Memory Tuning
# Engineered specifically for AMD Athlon Silver 3050U + 4GB RAM + 1TB SATA HDD
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ZRAM & Virtual Memory Management (Critical for 4 GB RAM)
# ------------------------------------------------------------------------------
# High swappiness aggressively pages idle anonymous memory into compressed ZRAM
# instead of evicting file cache pages, keeping 5400 RPM HDD disk cache warm.
vm.swappiness = 180

# Single-page ZRAM swapping: reads/writes 1 page (4KB) at a time with 0 latency
# instead of sequential 8-page blocks designed for mechanical HDDs.
vm.page-cluster = 0

# Prevent sudden proactive memory reclaim spikes that cause frame drops in games
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Keep file system metadata (inodes/dentries) in RAM to avoid random 5400 RPM HDD reads
vm.vfs_cache_pressure = 50

# Compact memory only when necessary to reduce background CPU cycles on 2C/2T CPU
vm.compaction_proactiveness = 0

# ------------------------------------------------------------------------------
# 2. 1 TB 5400 RPM HDD Write Stall Prevention
# ------------------------------------------------------------------------------
# Flush dirty pages in small bursts so the slow HDD never blocks the desktop UI
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# ------------------------------------------------------------------------------
# 3. Kernel Process Scheduling & Responsiveness (Athlon 3050U 2C/2T)
# ------------------------------------------------------------------------------
# Encourage immediate execution of waking interactive tasks (games, mouse input)
kernel.sched_migration_cost_ns = 500000
kernel.sched_latency_ns = 6000000
kernel.sched_min_granularity_ns = 750000
kernel.sched_wakeup_granularity_ns = 1000000

# ------------------------------------------------------------------------------
# 4. Gaming File Descriptors & Network
# ------------------------------------------------------------------------------
# Increase max file descriptors for Steam, Wine, and Proton titles
fs.file-max = 2097152

# Increase max memory map areas for Wine/Proton and modern Java heaps
vm.max_map_count = 2147483642

# Network low latency queue discipline (reduces multiplayer gaming ping jitter)
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

