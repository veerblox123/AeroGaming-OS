# ==============================================================================
# AeroGaming OS - Picom Compositor Configuration
# Tuned for Zero Gaming Input Lag & Radeon Vega 3 (Dali APU)
# ==============================================================================

# Backend
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
vsync = true;

# ------------------------------------------------------------------------------
# GAMING LATENCY OPTIMIZATION: UNREDIRECT FULLSCREEN
# ------------------------------------------------------------------------------
# When a game (like Minecraft or Steam) enters fullscreen, Picom stops drawing
# that window and hands direct buffer flip to the GPU. This eliminates 100%
# compositor input lag and maximizes FPS on the integrated Vega 3.
unredir-if-fullscreen = true;

# Disable heavy eye candy to keep CPU/GPU idle load minimal
shadow = false;
fading = false;
blur-background = false;

# Window Type Settings
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.98; shadow = false; }
  dropdown_menu = { opacity = 0.98; shadow = false; }
};

