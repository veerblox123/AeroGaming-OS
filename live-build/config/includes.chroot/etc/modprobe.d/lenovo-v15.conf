# ==============================================================================
# AeroGaming OS - Lenovo V15 ADA Kernel Module Tweaks
# ==============================================================================

# 1. AMDGPU Driver Settings for Vega 3 (Zen Dali APU)
# ppfeaturemask=0xffffffff enables full PowerPlay & DPM overclock/underclock capabilities
# dpm=1 enables dynamic power management
# audio=1 enables digital display audio (HDMI)
options amdgpu ppfeaturemask=0xffffffff dpm=1 audio=1

# 2. Realtek Wi-Fi (RTL8821CE / RTL8822CE) Latency Fix
# Disables PCIe Active State Power Management (ASPM) which causes random latency
# spikes and dropped connections on Lenovo V15 laptops when gaming on Wi-Fi
options rtw88_pci disable_aspm=y disable_msi=n
options rtw88_core disable_lps_deep=y

# 3. Lenovo Ideapad Laptop ACPI
# Ensures proper Fn-key behavior and touchpad hotkey handling
options ideapad_laptop fn_lock=1

