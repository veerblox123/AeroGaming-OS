[general]
; AeroGaming OS GameMode Configuration
; Tuned for AMD Athlon Silver 3050U + Radeon Vega 3

# Desired CPU governor when a game runs
desiredgov=performance

# Set I/O priority for the game process (0 = Realtime, 1-7 = Best Effort)
# 4 is high priority Best Effort
ioprio=0

# Renice game process priority (-10 is high priority without kernel starvations)
renice=-10

# Disable desktop compositor to eliminate frame drops and latency
softrealtime=auto
inhibit_screensaver=1

[gpu]
# AMDGPU Power Profile
# 1 = 3D Full Screen mode
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high

[cpu]
# Park idle cores or pin threads if needed
park_cores=no

[custom]
# Scripts invoked on game start / end
start=/usr/local/bin/gamemode-start-hook
end=/usr/local/bin/gamemode-end-hook

